name: Windows portable build

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

env:
  QT_VERSION: '6.9.3'
  QT_ARCH: 'win64_msvc2022_64'
  DIST_NAME: 'QuickViewer-portable-1.2.8-x64'

jobs:
  build:
    runs-on: windows-2022
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout source with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install Qt
        run: |
          python -m pip install --upgrade pip aqtinstall
          # QtSvg / QtSvgWidgets are part of the base package since Qt 6.8,
          # so no extra module is required for the svgwidgets module of qmake.
          python -m aqt install-qt windows desktop $env:QT_VERSION $env:QT_ARCH -O C:/Qt
          if ($LASTEXITCODE -ne 0) { throw 'Qt base installation failed' }

      - name: Configure Qt environment
        run: |
          $qtDir = "C:/Qt/$env:QT_VERSION/msvc2022_64"
          "Qt6_DIR=$qtDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "$qtDir/bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          Write-Host "Qt directory: $qtDir"
          Get-ChildItem "$qtDir/lib" -Filter 'Qt6Svg*' | Select-Object -ExpandProperty Name
          if (-not (Test-Path "$qtDir/lib/Qt6SvgWidgets.lib")) {
            throw "Qt6SvgWidgets.lib was not found in $qtDir - the QtSvgWidgets module is required by QuickViewer."
          }
          if (-not (Test-Path "$qtDir/bin/qmake.exe")) {
            throw "qmake.exe was not found in $qtDir/bin"
          }

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Run qmake
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          Push-Location build
          qmake -o Makefile -recursive ../QVproject.pro
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "qmake failed with exit code $code" }

      - name: Build with nmake
        run: |
          Push-Location build
          nmake
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { throw "nmake failed with exit code $code" }

      - name: Show build output
        run: |
          Get-ChildItem build/bin | Select-Object Name, Length
          Get-ChildItem build/lib -Filter '*.dll' | Select-Object Name, Length

      - name: Verify the QuickViewer executable
        run: |
          function Get-Hits([string]$path, [string]$needle) {
            if (-not (Test-Path $path)) { return -1 }
            $raw = [System.Text.Encoding]::GetEncoding('ISO-8859-1').GetString([System.IO.File]::ReadAllBytes($path))
            return ([regex]::Matches($raw, [regex]::Escape($needle))).Count
          }
          $exe = 'build/bin/QuickViewer.exe'
          $latin1 = [System.Text.Encoding]::GetEncoding('ISO-8859-1')
          $closeLabel = $latin1.GetString([byte[]](0xE5,0x85,0xB3,0xE9,0x97,0xAD))
          $minimizeLabel = $latin1.GetString([byte[]](0xE6,0x9C,0x80,0xE5,0xB0,0x8F,0xE5,0x8C,0x96))

          Write-Host '--- entry points that were compiled ---'
          foreach ($p in @('build/QuickViewer/release/main.obj',
                           'build/AssociateFilesWithQuickViewer/release/associatefiles.obj')) {
            Write-Host ("   {0}: QT_QPA_PLATFORM={1} quickviewer_={2}" -f $p, (Get-Hits $p 'QT_QPA_PLATFORM'), (Get-Hits $p 'quickviewer_'))
          }

          Write-Host '--- checks on the linked exe ---'
          $okMain = (Get-Hits $exe 'QT_QPA_PLATFORM') -gt 0
          $okFeature = ((Get-Hits $exe 'qvCaptionButtonsInstalled') -gt 0) -and
                       ((Get-Hits $exe $closeLabel) -gt 0) -and
                       ((Get-Hits $exe $minimizeLabel) -gt 0)
          Write-Host ("   QuickViewer main() present  : {0}" -f $okMain)
          Write-Host ("   caption buttons patch       : {0}" -f $okFeature)
          Write-Host ("   exe size                    : {0}" -f (Get-Item $exe).Length)

          if (-not $okMain) { throw 'QuickViewer.exe was linked without the QuickViewer main() - refusing to publish a broken package' }
          if (-not $okFeature) { throw 'The caption buttons patch is missing from QuickViewer.exe' }

      - name: Assemble portable package
        run: |
          $dist = $env:DIST_NAME
          New-Item -ItemType Directory -Force -Path $dist, "$dist/translations", "$dist/database" | Out-Null

          Copy-Item build/bin/QuickViewer.exe $dist -Force
          Copy-Item build/bin/AssociateFilesWithQuickViewer.exe $dist -Force
          Copy-Item Qt7z/Qt7z/windll/x64/7z.dll $dist -Force
          Copy-Item build/lib/QSVGNative0.dll $dist -Force
          Copy-Item README.md, LICENSE $dist -Force

          Copy-Item QuickViewer/translations/languages.ini $dist/translations -Force
          Copy-Item QuickViewer/translations/*.qm $dist/translations -Force
          Copy-Item "$env:Qt6_DIR/translations/qt_zh_CN.qm" $dist/translations -Force -ErrorAction SilentlyContinue
          Copy-Item QuickViewer/database/schema.sql, QuickViewer/database/thumbnail.sqlite3.db $dist/database -Force

          windeployqt --release --compiler-runtime --no-translations "$dist/QuickViewer.exe"
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }

          New-Item -ItemType Directory -Force -Path "$dist/platforms" | Out-Null
          Copy-Item "$env:Qt6_DIR/plugins/platforms/qdirect2d.dll" "$dist/platforms" -Force -ErrorAction SilentlyContinue

          Get-ChildItem $dist -Recurse -File | Measure-Object -Property Length -Sum |
            ForEach-Object { Write-Host ("{0} files, {1:N1} MB" -f $_.Count, ($_.Sum / 1MB)) }

      - name: Create zip archive
        run: |
          $zip = "$env:DIST_NAME.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          if (Get-Command 7z -ErrorAction SilentlyContinue) {
            7z a -tzip -mx=5 $zip ".\$env:DIST_NAME"
            if ($LASTEXITCODE -ne 0) { throw '7z failed' }
          } else {
            Compress-Archive -Path ".\$env:DIST_NAME" -DestinationPath $zip
          }
          Get-Item $zip | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DIST_NAME }}
          path: ${{ env.DIST_NAME }}.zip
          if-no-files-found: error

      - name: Publish release with portable package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "portable-${{ github.run_number }}" "$env:DIST_NAME.zip" `
            --title "QuickViewer portable build #${{ github.run_number }} (1.2.8-x64)" `
            --notes "Automated Windows portable build of QuickViewer 1.2.8 (x64), including the extra close button in the full screen toolbar."
          if ($LASTEXITCODE -ne 0) { throw 'gh release create failed' }
